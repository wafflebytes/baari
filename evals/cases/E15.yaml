notes: >
  Pending: prefs.cuisine {c: [korean], like: [korean-ramen], no: [], freq: "1w", who: [Vinay, Mummy]}
  isn't on rails, and rails doesn't know Korean ramen yet, so the tg.send pick guard would refuse
  its button and there's no NEEDS for it. Written against the contract. Five runs: the shortlist
  offers Korean ramen (S1: at most one cuisine dish); LOCK starts from a fixed shortlist and Vinay
  picks it; BUY puts gochujang and the noodles on the Delhivery parcel (the kirana doesn't sell
  them) and the kirana gets only the house plates' items; the brief splits plates by name (K1):
  ramen for Vinay and Mummy, Lauki chana dal for Papa and Behen; the next night's CUISINE says
  none, so ramen isn't offered again that week. The NEEDS line is written by hand as rails would
  write it for a split night (2 ramen plates, 2 house plates).
