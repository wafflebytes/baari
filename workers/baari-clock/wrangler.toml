name = "baari-clock"
main = "src/index.js"
compatibility_date = "2026-09-01"

# One trigger, every minute (the free plan allows 5 per account). The Worker
# posts the rails heartbeat each minute, checks the KB every 5 minutes,
# refreshes the session at :00 and :30, and fires phases at their IST times
# only after POST /crons {"on": true}.
[triggers]
crons = ["* * * * *"]

[vars]
AO_BASE = "https://agenticorg.hackathon.pinelabs.com"
RAILS_BASE = "https://baari-rails.vercel.app"

# Secrets (wrangler secret put): CLOCK_KEY, RAILS_ADMIN_KEY, AO_SESSION, AO_CSRF

[[kv_namespaces]]
binding = "CLOCK"
id = "c4ac119c84cd4c00ac7166bbed08b5d7"

# No R2 on this account. Small media lives on rails (PUT /admin/media/<name>,
# public GET /media/f/<name>); the screen recordings go to Google Drive.
