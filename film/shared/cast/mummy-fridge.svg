<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Mummy at the open fridge, from behind. Drawn in the landing cast's language:
       flat fills, no outlines on bodies, ink only for small details. Her colours
       come from her Personas look (straight bun, skin d78774, pink f55d81). -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#FFF7DC"/>
      <stop offset="0.7" stop-color="#FFEFC2"/>
      <stop offset="1" stop-color="#FCE6B0"/>
    </radialGradient>
    <radialGradient id="spill" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE9A8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="door" x1="0" x2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDE7DA"/>
    </linearGradient>
    <linearGradient id="kurta" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#F7678A"/>
      <stop offset="1" stop-color="#EE5A7E"/>
    </linearGradient>
  </defs>

  <!-- floor -->
  <rect x="0" y="930" width="1920" height="150" fill="#EFE9DD"/>
  <ellipse cx="1180" cy="950" rx="420" ry="46" fill="url(#spill)"/>

  <!-- fridge body: the inside is lit -->
  <rect x="980" y="150" width="440" height="800" rx="34" fill="#FFFFFF"/>
  <rect x="1004" y="176" width="392" height="752" rx="20" fill="url(#glow)"/>
  <!-- freezer divider and shelves -->
  <rect x="1004" y="372" width="392" height="14" fill="#F3DFAE"/>
  <rect x="1004" y="560" width="392" height="10" fill="#F0E3C2"/>
  <rect x="1004" y="720" width="392" height="10" fill="#F0E3C2"/>
  <!-- freezer: an ice tray and a bag of peas -->
  <rect x="1040" y="300" width="130" height="40" rx="8" fill="#E2EEF7"/>
  <rect x="1210" y="270" width="110" height="74" rx="14" fill="#7CC4A0"/>
  <!-- top shelf: steel dabba, milk packet, a small katori -->
  <rect x="1040" y="470" width="120" height="90" rx="14" fill="#CFD3D6"/>
  <rect x="1040" y="462" width="120" height="18" rx="9" fill="#B9BEC2"/>
  <path d="M1196 560 L1196 476 Q1196 462 1210 462 L1262 462 Q1276 462 1276 476 L1276 560 Z" fill="#FFFFFF"/>
  <rect x="1196" y="496" width="80" height="26" fill="#5B8DEF"/>
  <ellipse cx="1338" cy="548" rx="40" ry="12" fill="#D7DADC"/>
  <path d="M1298 532 Q1338 572 1378 532 Z" fill="#C4C8CB"/>
  <!-- middle shelf: the lauki, waiting -->
  <g transform="rotate(-6 1200 690)">
    <ellipse cx="1210" cy="688" rx="150" ry="34" fill="#8CC56A"/>
    <ellipse cx="1092" cy="682" rx="46" ry="40" fill="#8CC56A"/>
    <path d="M1080 668 Q1200 660 1330 676" stroke="#B7DE95" stroke-width="7" stroke-linecap="round" fill="none"/>
    <rect x="1354" y="680" width="22" height="12" rx="5" fill="#6C9A4C"/>
  </g>
  <!-- crisper: one tomato left -->
  <rect x="1030" y="790" width="340" height="120" rx="18" fill="#FFFFFF" opacity="0.65"/>
  <circle cx="1300" cy="860" r="34" fill="#F0503A"/>
  <path d="M1288 828 L1300 838 L1312 828" stroke="#3C8D3A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- the open door, swung toward us -->
  <path d="M1420 156 L1590 110 L1590 990 L1420 944 Z" fill="url(#door)"/>
  <path d="M1438 330 L1574 304 M1438 560 L1574 548 M1438 780 L1574 778" stroke="#E2DBCB" stroke-width="10" stroke-linecap="round"/>
  <rect x="1460" y="236" width="34" height="88" rx="10" fill="#F2B705"/>
  <rect x="1508" y="246" width="30" height="74" rx="10" fill="#F0503A"/>
  <rect x="1462" y="476" width="40" height="78" rx="12" fill="#DDEFE3"/>
  <rect x="1516" y="484" width="34" height="68" rx="10" fill="#FFFFFF"/>
  <!-- a sticky note on the door: no words, just the habit -->
  <rect x="1500" y="640" width="70" height="64" rx="6" fill="#FFE37A" transform="rotate(5 1535 672)"/>

  <!-- Mummy, from behind -->
  <g id="mummy">
    <!-- feet -->
    <ellipse cx="900" cy="960" rx="34" ry="13" fill="#B4553F"/>
    <ellipse cx="985" cy="962" rx="34" ry="13" fill="#B4553F"/>
    <!-- saree falling to the floor -->
    <path d="M808 650 Q790 820 816 952 L1074 952 Q1098 820 1064 650 Z" fill="#F55D81"/>
    <!-- pleats -->
    <path d="M900 770 Q894 860 902 950 M940 760 Q942 860 944 950 M980 770 Q990 860 986 950" stroke="#E24A70" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- left arm, down -->
    <path d="M806 560 Q770 650 786 760" stroke="#F55D81" stroke-width="54" stroke-linecap="round" fill="none"/>
    <circle cx="788" cy="774" r="25" fill="#D78774"/>
    <!-- right arm, up to the door -->
    <path d="M1056 560 Q1150 520 1260 430" stroke="#F55D81" stroke-width="50" stroke-linecap="round" fill="none"/>
    <path d="M1250 438 Q1330 380 1418 330" stroke="#D78774" stroke-width="36" stroke-linecap="round" fill="none"/>
    <circle cx="1424" cy="326" r="23" fill="#D78774"/>
    <!-- back of the blouse and shoulders -->
    <path d="M818 690 Q800 600 834 548 Q936 514 1036 548 Q1072 600 1056 690 Z" fill="url(#kurta)"/>
    <!-- the pallu over her left shoulder, a haldi border -->
    <path d="M840 540 Q936 560 1004 690 L1020 952 L944 952 Q930 760 830 600 Z" fill="#D63D66"/>
    <path d="M840 540 Q936 560 1004 690 L1020 952" stroke="#F2B705" stroke-width="11" fill="none" stroke-linejoin="round"/>
    <!-- neck -->
    <rect x="910" y="480" width="54" height="64" rx="20" fill="#C9705E"/>
    <!-- ears -->
    <ellipse cx="866" cy="430" rx="15" ry="22" fill="#D78774"/>
    <ellipse cx="1008" cy="430" rx="15" ry="22" fill="#D78774"/>
    <!-- head: hair from behind -->
    <circle cx="937" cy="410" r="74" fill="#362C47"/>
    <path d="M870 438 Q937 492 1004 438 Q996 488 937 496 Q878 488 870 438 Z" fill="#2B2339"/>
    <!-- the bun, and her pink band -->
    <circle cx="937" cy="320" r="40" fill="#362C47"/>
    <rect x="904" y="346" width="66" height="14" rx="7" fill="#F55D81"/>
    <!-- reading-glasses chain at the back of her neck -->
    <path d="M884 470 Q937 540 990 470" stroke="#C99A2E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
