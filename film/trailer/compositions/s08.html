      (function () {

        // The box clips at x 96 and its line is anchored right once it overflows, so a

        const BOX = 1728;

            while (gone < i && line - m.x[gone] > BOX) tl.set(ls[gone++], { visibility: "hidden" }, t);

        };

          M.cut(tl, `#s08-p${n}`, from);
          M.type(tl, `#s08-g${n}`, from, { words, seed: `s08-${n}`, until: to });

          M.cut(tl, `#s08-e${n}`, words[0]);
          M.cut(tl, `#s08-p${n}`, to, false);
        };
        // The scale cut: the same rule, small, in the app. The phone holds its place.
        const app = (from, to) => {
          M.cut(tl, ["#s08-phone", "#s08-tag"], from);
          M.cut(tl, ["#s08-phone", "#s08-tag"], to, false);
        };
