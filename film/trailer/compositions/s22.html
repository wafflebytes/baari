<template id="s22-template">
  <div data-composition-id="s22" data-width="1920" data-height="1080" data-duration="6.094" style="position:absolute;inset:0">
    <style>
      /* Sunita's morning. One greeting a beat in six scripts, each voiced by a
         slice of the app's own brief audio (app/audio/brief-*.mp3), then the
         Hindi brief as karaoke on brief.json's word timings. */
      .s22-g { position: absolute; left: 0; right: 0; top: 330px; text-align: center; font-size: 260px; line-height: 1.25; font-weight: 600; color: var(--ink); white-space: nowrap; opacity: 0; }
      .s22-g small { display: block; margin-top: 8px; font: 500 35px/1.3 var(--sans); letter-spacing: -0.012em; color: var(--mute); }
      .s22-deva { font-family: "Noto Sans Devanagari"; }
      .s22-beng { font-family: "Noto Sans Bengali"; }
      .s22-taml { font-family: "Noto Sans Tamil"; font-size: 220px; }
      .s22-knda { font-family: "Noto Sans Kannada"; }
      .s22-telu { font-family: "Noto Sans Telugu"; font-size: 220px; }
      #s22-k { position: absolute; left: 96px; top: 300px; width: 1600px; font: 600 107px/1.45 "Noto Sans Devanagari"; color: var(--mute); }
      #s22-k span { border-radius: 0.16em; padding: 0 0.06em; margin: 0 -0.06em; }
      #s22-ken { position: absolute; left: 96px; top: 660px; font: 500 35px/1.3 var(--sans); letter-spacing: -0.012em; color: var(--mute); }
    </style>
    <div class="shot">
      <div class="s22-g s22-deva" id="s22-g0">नमस्ते<small>Hindi</small></div>
      <div class="s22-g s22-deva" id="s22-g1">नमस्कार<small>Marathi</small></div>
      <div class="s22-g s22-beng" id="s22-g2">নমস্কার<small>Bangla</small></div>
      <div class="s22-g s22-taml" id="s22-g3">வணக்கம்<small>Tamil</small></div>
      <div class="s22-g s22-knda" id="s22-g4">ನಮಸ್ಕಾರ<small>Kannada</small></div>
      <div class="s22-g s22-telu" id="s22-g5">నమస్కారం<small>Telugu</small></div>
      <div id="s22-k"></div>
      <div id="s22-ken">Tomorrow afternoon, rajma chawal, for four people.</div>
    </div>
    <script>
      (function () {
        const M = MOVES, C = TIMING.cues.s22, F = 1 / 30, tl = gsap.timeline({ paused: true });
        // The greetings: each lands on its beat and leaves just before the next.
        C.greet.forEach((t, i) => {
          const el = "#s22-g" + i;
          M.enter(tl, el, t, { dur: 0.22, rise: 20, blur: 6 });
          const next = i < 5 ? C.greet[i + 1] : C.karaoke;
          M.exit(tl, el, next - 0.12, { dur: 0.12, rise: 16, blur: 6 });
        });
        // Karaoke: the line lands whole in mute; each word turns ink with a
        // haldi tint while it is spoken, then stays ink.
        const box = document.getElementById("s22-k");
        C.words.forEach(([w], i) => { const s = document.createElement("span"); s.textContent = w; box.appendChild(s); if (i < C.words.length - 1) box.appendChild(document.createTextNode(" ")); });
        const spans = box.querySelectorAll("span");
        M.enter(tl, "#s22-k", C.karaoke - 0.05, { dur: 0.3, rise: 18 });
        M.enter(tl, "#s22-ken", C.karaoke + 0.1, { dur: 0.3, rise: 16 });
        C.words.forEach(([, a, b], i) => {
          tl.to(spans[i], { color: "#15130F", backgroundColor: "rgba(253, 242, 211, 1)", duration: 0.08, ease: M.e }, a);
          tl.to(spans[i], { backgroundColor: "rgba(253, 242, 211, 0)", duration: 0.12, ease: M.e }, b);
        });
        tl.set({}, {}, 6.094);
        window.__timelines["s22"] = tl;
      })();
    </script>
  </div>
</template>
