      .s13-f { position: absolute; top: 390px; width: 220px; height: 220px; }

      (function () {
        const M = MOTION, C = TIMING.cues.s13, tl = gsap.timeline({ paused: true });
        // The row holds, then leaves with the first verb.
        M.cut(tl, ".s13-f", C.verbs, false);
        // One object a beat, in place, hard cuts (a flash that doesn't keep its last).
        M.flash(tl, ["#s13-o1", "#s13-o2", "#s13-o3", "#s13-o4"], C.verbs, { each: TIMING.beat });

        M.cut(tl, "#s13-card", C.card);
        ["#s13-b1", "#s13-b2", "#s13-b3"].forEach((b, i) => M.cut(tl, b, C.card + i * M.TICK));
        M.cut(tl, ".s13-b", C.scaffoldOut, false);
        tl.set({}, {}, 3.281);
        window.__timelines["s13"] = tl;
