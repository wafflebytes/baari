<template id="s16-template">
  <div data-composition-id="s16" data-width="1920" data-height="1080" data-duration="3.281" style="position:absolute;inset:0">
    <style>
      /* The soaking turn. Text set into the picture (strip 20), then the click (ref
         786-798, strip 24). The app's own task card holds in the phone while L13 gives
         the turn to Vinay; on L14 his "Main?" types on beside it, on the voice; then the
         cursor glides onto "Bhigo diya" and on the beat the card is done, same framing,
         new state (CA69 at real speed: the take's tap, its haldi card and "Vinay ne
         9:42 pm pe kar diya"). The click carries into shot 17's haldi button. */
      #s16-phone { left: 1370px; top: 150px; width: 406px; height: 848px; }
      #s16-phone video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #s16-say { position: absolute; left: 96px; top: 330px; font: 500 260px/300px var(--display); letter-spacing: -0.04em; color: var(--ink); white-space: nowrap; }
      #s16-cur { z-index: 30; }
    </style>
    <div class="shot">
      <div class="phone" id="s16-phone"><div class="scr">
        <video id="s16-task" src="assets/b/s16-task.mp4" data-start="0" data-duration="3.067" data-media-start="0" data-track-index="0" muted playsinline></video>
        <video id="s16-done" src="assets/b/s16-done.mp4" data-start="3.067" data-duration="0.214" data-media-start="0" data-track-index="0" muted playsinline></video>
      </div></div>
      <div id="s16-say"><span id="s16-main">Main?</span></div>
      <div class="m-cursor" id="s16-cur"></div>
      <div class="tag glass" id="s16-tag">App, real speed</div>
    </div>
    <script>
      (function () {
        const M = MOTION, C = TIMING.cues.s16, tl = gsap.timeline({ paused: true });
        document.getElementById("s16-cur").innerHTML = M.cursorSVG;
        M.hide("#s16-cur");
        // "Main?" types on L14, and the caret holds until the click.
        M.type(tl, "#s16-main", C.main, { seed: "s16", until: C.click });
        // The click on "Bhigo diya": the take's own button turns, so no colour tween here.
        // The done state is the second <video>, whose data-start is the time M.click
        // returns (two frames after the colour would land): 2.8 + 0.267 = 3.067.
        const next = M.click(tl, { at: C.click, cursor: "#s16-cur", from: { x: 1820, y: 1000 }, to: { x: C.tapX, y: C.tapY } });
        M.cut(tl, "#s16-cur", next, false);
        tl.set({}, {}, 3.281);
        window.__timelines["s16"] = tl;
      })();
    </script>
  </div>
</template>
