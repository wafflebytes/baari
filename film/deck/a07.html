<body class="ap">
<div id="root" class="frame" data-composition-id="a07" data-start="0" data-duration="4" data-width="1920" data-height="1080">

  <iframe class="dg" id="dg" src="../../docs/diagrams/src/05-bridge.html?slide" title="The phrasebook between Baari and rails" data-size-na></iframe>
</div>
<script>
// Diagram 05-bridge at full detail, the README's own cut, for reading in the PDF (DECK_PLAN
// appendix A7). Its labels run under 22 px on purpose: projector size is n/a here and
// noted in checks/CHECKS.md. The diagram is scaled so its content fills the safe area.
const S = deckSlide("a07"), tl = S.tl, M = MOVES;
const f = document.getElementById("dg");
f.addEventListener("load", () => {
  const w = f.contentWindow;
  const go = () => {
    const d = f.contentDocument, cv = d.querySelector(".canvas");
    f.style.width = cv.offsetWidth + "px"; f.style.height = cv.offsetHeight + "px";
    // the union of everything drawn on the canvas
    const c = cv.getBoundingClientRect(), b = { l: 1e9, t: 1e9, r: -1e9, b: -1e9 };
    for (const e of cv.querySelectorAll(":scope > *:not(svg)")) {
      const r = e.getBoundingClientRect(); if (!r.width || !r.height) continue;
      if (r.width > 0.95 * c.width && r.height > 0.9 * c.height) continue; // a full-canvas layer, not content
      b.l = Math.min(b.l, r.left - c.left); b.t = Math.min(b.t, r.top - c.top); b.r = Math.max(b.r, r.right - c.left); b.b = Math.max(b.b, r.bottom - c.top);
    }
    const s = Math.min(1728 / (b.r - b.l), 960 / (b.b - b.t));
    const x = 96 + (1728 - (b.r - b.l) * s) / 2 - b.l * s, y = 60 - b.t * s;
    gsap.set(f, { x, y, scale: s });
    tl.fromTo(f, { opacity: 0 }, { opacity: 1, duration: 0.52, ease: M.e }, 0.1);
    tl.set({}, {}, 0.1 + 0.52 + 1.5);
    chrome(tl, "a07");
    S.done();
  };
  if (w.__ready) go(); else { const iv = setInterval(() => { if (w.__ready) { clearInterval(iv); go(); } }, 30); }
});
</script>
</body></html>
