<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Slide 6 · What we'd have built without it</title>
<link rel="stylesheet" href="shared/theme.css"><link rel="stylesheet" href="deck.css">
<script src="shared/vendor/gsap.min.js"></script><script src="shared/moves.js"></script><script src="timing.js"></script><script src="slide.js"></script><script src="chrome.js"></script>
<style>
  .no { position: absolute; left: 96px; top: 210px; width: 840px; white-space: nowrap; }
  .no .l { position: relative; display: inline-block; color: var(--mute); }
  .no .l + br + .l { margin-top: 10px; }
  .no .strike { position: absolute; left: -6px; right: -6px; top: 54%; height: 6px; border-radius: 3px; background: var(--ink); transform-origin: 0 50%; }
  .yes { position: absolute; left: 1000px; top: 210px; width: 824px; }
  .bar { position: absolute; left: 96px; top: 620px; width: 1728px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .seg { position: relative; height: 200px; border-radius: 24px; padding: 30px 32px; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--hair); overflow: hidden; }
  .seg .fill { position: absolute; inset: 0; background: var(--jelly); transform-origin: 0 50%; }
  .seg .nm { position: relative; font: 500 44px/1.1 var(--display); letter-spacing: -0.03em; color: var(--ink); }
  .seg .who { position: absolute; left: 32px; bottom: 26px; display: flex; gap: 10px; align-items: center; }
  .seg .who img { width: 54px; height: 54px; }
  .seg .who .bp { width: 58px; height: 58px; border-radius: 50%; background: var(--island); display: grid; place-items: center; box-shadow: 0 0 0 1.5px rgba(242,183,5,0.8); }
  .seg .who .bp img { width: 40px; height: 40px; }
  .bar + .src { position: absolute; left: 96px; top: 846px; }
</style></head>
<body>
<div id="root" class="frame" data-composition-id="s06" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <div class="track"></div>
  <div class="no display t4"><span class="l">A recipe recommender.<i class="strike"></i></span><br><span class="l">A Sunday meal planner.<i class="strike"></i></span></div>
  <div class="yes display t4">An agent that holds the kitchen, and gets the family to <span class="mark">agree the night before.</span></div>
  <div class="bar">
    <div class="seg"><i class="fill"></i><div class="nm">Anticipate</div><div class="who"><span class="bp"><img src="shared/img/baari-mark.png" alt=""></span></div></div>
    <div class="seg"><i class="fill"></i><div class="nm">Find options</div><div class="who"><span class="bp"><img src="shared/img/baari-mark.png" alt=""></span></div></div>
    <div class="seg"><div class="nm">Decide</div><div class="who"><img src="shared/cast/face-mummy.svg" alt=""><img src="shared/cast/face-papa.svg" alt=""><img src="shared/cast/face-didi.svg" alt=""><img src="shared/cast/face-vinay.svg" alt=""></div></div>
    <div class="seg"><i class="fill"></i><div class="nm">Monitor</div><div class="who"><span class="bp"><img src="shared/img/baari-mark.png" alt=""></span></div></div>
  </div>
  <div class="src">Four steps of the mental load: Allison Daminger, American Sociological Review 84(4), 2019</div>
</div>
<script>
// The strike draws across what we'd have built; then the bar fills, skipping "Decide",
// which stays with the family's faces (DECK_PLAN slide 6). Step 1 ends at 1.4 s.
const S = deckSlide("s06"), tl = S.tl, M = MOVES;
M.enter(tl, ".no .l", 0.1, { stagger: 0.12 });
tl.fromTo(".strike", { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: M.e, stagger: 0.16 }, 0.55);
tl.to(".no .l", { opacity: 0.55, duration: 0.3, ease: M.e }, 0.9);
M.enter(tl, ".yes", 0.9, { rise: 16 });
const at = S.at(0);
M.enter(tl, ".seg", at, { stagger: 0.08, rise: 16 });
M.enter(tl, ".bar + .src", at + 0.3, { rise: 8 });
// hero move: haldi fills Baari's three steps in order, Decide stays white
tl.fromTo(".seg .fill", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: M.e, stagger: 0.32 }, at + 0.45);
M.pop(tl, ".seg .who .bp", at + 0.75, { stagger: 0.32, from: 0.5 });
M.pop(tl, ".seg:nth-child(3) .who img", at + 0.5, { stagger: 0.07 });
tl.set({}, {}, at + 0.75 + 0.64 + 0.55 + 1.5);
chrome(tl, "s06");
S.done();
</script>
</body></html>
