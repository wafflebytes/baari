<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Slide 2 · Whose baari: Mummy's</title>
<link rel="stylesheet" href="shared/theme.css"><link rel="stylesheet" href="deck.css">
<script src="shared/vendor/gsap.min.js"></script><script src="shared/moves.js"></script><script src="timing.js"></script><script src="slide.js"></script><script src="chrome.js"></script>
<style>
  .scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .stat { position: absolute; left: 96px; top: 846px; padding: 20px 28px; border-radius: 24px; }
  .stat .n { font: 500 35px/1.25 var(--mono); letter-spacing: -0.02em; color: var(--ink); }
  .stat .n b { font-weight: 500; color: var(--haldi-text); }
  .stat .src { display: block; margin-top: 8px; }
</style></head>
<body>
<div id="root" class="frame" data-composition-id="s02" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <img class="scene" src="shared/cast/mummy-fridge.svg" alt="">
  <div class="track"></div>
  <div class="title display t5">Aaj kiski baari?<br><span class="mark">Roz Mummy ki.</span></div>
  <div class="thought glass" style="left:96px;top:420px"><i></i>Fridge mein kya hai?</div>
  <div class="thought glass" style="left:186px;top:516px"><i></i>Kal kya bana tha?</div>
  <div class="thought glass" style="left:186px;top:612px"><i></i>Papa: aloo nahi</div>
  <div class="thought glass" style="left:96px;top:708px"><i></i>Subah tak kya aayega?</div>
  <div class="stat glass"><div class="n">Women: <b>299 min</b> a day · Men: 97</div><span class="src">Unpaid domestic work · NSO Time Use Survey 2019</span></div>
</div>
<script>
// Four things only Mummy holds orbit out of her head and settle on the wall beside her (DECK_PLAN slide 2).
const S = deckSlide("s02"), tl = S.tl, M = MOVES;
tl.fromTo(".scene", { opacity: 0, scale: 1.02 }, { opacity: 1, scale: 1, duration: 0.52, ease: M.e, transformOrigin: "60% 40%" }, 0);
M.enter(tl, ".title", 0.15);
// hero move: each chip leaves her head (937, 410) on a curve and lands on the wall
document.querySelectorAll(".thought").forEach((c, i) => {
  const x = parseFloat(c.style.left), y = parseFloat(c.style.top), at = 0.6 + i * 0.3;
  tl.fromTo(c, { x: 900 - x, opacity: 0, scale: 0.4 }, { x: 0, opacity: 1, scale: 1, duration: 0.52, ease: "power3.out" }, at);
  tl.fromTo(c, { y: 400 - y }, { y: 0, duration: 0.52, ease: M.e }, at);
});
M.enter(tl, ".stat", 2.2, { rise: 16 });
tl.set({}, {}, 2.2 + 0.52 + 1.6);
chrome(tl, "s02");
S.done();
</script>
</body></html>
