<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Slide 16 · The ask: an agent mandate</title>
<link rel="stylesheet" href="shared/theme.css"><link rel="stylesheet" href="deck.css">
<script src="shared/vendor/gsap.min.js"></script><script src="shared/moves.js"></script><script src="timing.js"></script><script src="slide.js"></script><script src="chrome.js"></script>
<style>
  .spec { position: absolute; left: 96px; top: 340px; width: 1728px; padding: 22px 48px; border-radius: 28px; background: var(--island); color: #F3F0E9;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 0 0 1.5px rgba(242, 183, 5, 0.75), 0 40px 70px -40px rgba(30, 20, 0, 0.6); }
  .row { display: grid; grid-template-columns: 210px 1fr auto; align-items: center; height: 104px; font: 500 35px/1 var(--mono); letter-spacing: -0.02em; }
  .row + .row { border-top: 1px solid rgba(255, 255, 255, 0.08); }
  .row b { font-weight: 500; color: var(--haldi); }
  .row .v { white-space: nowrap; }
  .row .v em { font-style: normal; color: var(--island-2); }
  .row i { font-style: normal; color: var(--island-2); white-space: nowrap; }
</style></head>
<body>
<div id="root" class="frame" data-composition-id="s16" data-start="0" data-duration="8" data-width="1920" data-height="1080">
  <div class="track"></div>
  <div class="title display t4">The ask: an agent mandate.</div>
  <div class="spec">
    <div class="row"><b>policy</b><span class="v">payees · ask_above 300 · day_cap 400</span><i>// E04</i></div>
    <div class="row"><b>reason</b><span class="v">"rajma for tomorrow"</span><i>// families see why</i></div>
    <div class="row"><b>events</b><span class="v">refused · paid <em>→</em> webhook</span><i></i></div>
    <div class="row"><b>next</b><span class="v">one delegate, many households</span><i></i></div>
  </div>
</div>
<script>
// The card builds line by line, its evidence arriving as a comment beside the line (DECK_PLAN slide 16).
const S = deckSlide("s16"), tl = S.tl, M = MOVES;
M.enter(tl, ".title", 0.1);
M.enter(tl, ".spec", 0.5, { rise: 24 });
document.querySelectorAll(".row").forEach((r, i) => {
  const at = 1.0 + i * 1.1;
  M.enter(tl, [r.querySelector("b"), r.querySelector(".v")], at, { rise: 12 });
  M.enter(tl, r.querySelector("i"), at + 0.45, { dx: -16, rise: 0 });
});
tl.set({}, {}, 1.0 + 4 * 1.1 + 1.5);
chrome(tl, "s16");
S.done();
</script>
</body></html>
