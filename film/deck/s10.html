<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Slide 10 · How it's wired, and what wakes it</title>
<link rel="stylesheet" href="shared/theme.css"><link rel="stylesheet" href="deck.css">
<script src="shared/vendor/gsap.min.js"></script><script src="shared/moves.js"></script><script src="timing.js"></script><script src="slide.js"></script><script src="chrome.js"></script>
<style>
  .dg { position: absolute; left: 96px; top: 166px; width: 1728px; height: 860px; border: 0; background: transparent; }
</style></head>
<body>
<div id="root" class="frame" data-composition-id="s10" data-start="0" data-duration="16" data-width="1920" data-height="1080">
  <div class="track"></div>
  <iframe class="dg" id="d02" src="../../docs/diagrams/src/02-ambient.html?slide" title="Baari sleeps until something needs it"></iframe>
</div>
<script>
// Beat 2 of slide 10: diagram 02's slide cut, built in the order the talk names it.
// (Beat 1, diagram 01, joins at the first stop once its slide cut exists.)
const S = deckSlide("s10"), tl = S.tl, M = MOVES;
const f = document.getElementById("d02");
f.addEventListener("load", () => {
  const w = f.contentWindow;
  const go = () => {
    const d = f.contentDocument, $ = (s) => d.querySelectorAll(s);
    const B = 0.3;
    M.enter(tl, $("#s-title"), B);
    M.enter(tl, $(".s-cause"), B + 0.5, { stagger: 0.47 });
    M.enter(tl, [...$(".s-hr"), ...$("#s-ruler")], B + 2.6, { stagger: 0.04 });
    // the night: each wake's dot, wire and card in time order; the heard ones land on a beat
    const cols = $(".s-col");
    cols.forEach((c, i) => {
      const at = B + 3.2 + i * 0.32;
      const wire = d.getElementById(`s-wire-${i}`), dot = d.getElementById(`s-dot-${i}`);
      const len = wire.getTotalLength();
      tl.fromTo(dot, { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: M.e }, at);
      tl.fromTo(wire, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.4, ease: M.e }, at + 0.05);
      M.enter(tl, c, at + 0.3, { rise: 16 });
    });
    const after = B + 3.2 + cols.length * 0.32 + 0.6;
    M.enter(tl, $(".s-stat"), after, { stagger: 0.3 });
    [12, 5, 0].forEach((n, i) => { const el = d.querySelector(`#s-stat-${i} .n`); if (n) M.count(tl, el, n, after + i * 0.3, { dur: 0.8 }); });
    tl.set({}, {}, after + 2.2);
    chrome(tl, "s10");
    S.done();
  };
  if (w.__ready) go(); else { const iv = setInterval(() => { if (w.__ready) { clearInterval(iv); go(); } }, 30); }
});
</script>
</body></html>
