<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Slide 10a · How it's wired</title>
<link rel="stylesheet" href="shared/theme.css"><link rel="stylesheet" href="deck.css">
<script src="shared/vendor/gsap.min.js"></script><script src="shared/moves.js"></script><script src="timing.js"></script><script src="slide.js"></script><script src="chrome.js"></script>
<style>
  .dg { position: absolute; left: 96px; top: 166px; width: 1728px; height: 860px; border: 0; background: transparent; }
</style></head>
<body>
<div id="root" class="frame" data-composition-id="s10a" data-start="0" data-duration="12" data-width="1920" data-height="1080">
  <div class="track"></div>
  <iframe class="dg" id="d01" src="../../docs/diagrams/src/01-system.html?slide" title="How Baari is wired"></iframe>
  <div class="title display t2">The model decides and talks.<br>Our rails hold <span class="mark">every rule</span>.</div>
</div>
<script>
// Beat 1 of slide 10: diagram 01's slide cut, built left to right in five steps
// (the house, Telegram and Twilio, our rails, AgenticOrg, the partners), then one
// haldi path lights end to end: clock, Baari, bridge, guards, Pine Labs (DECK_PLAN slide 10).
const S = deckSlide("s10a"), tl = S.tl, M = MOVES;
const f = document.getElementById("d01");
f.addEventListener("load", () => {
  const w = f.contentWindow;
  const go = () => {
    const d = f.contentDocument, $ = (s) => [...d.querySelectorAll(s)], id = (x) => d.getElementById(x);
    const draw = (ids, at) => ids.forEach((k, i) => {
      const p = id(k); if (!p) return;
      // a dashed wire keeps its dashes and fades in; a solid one draws
      if (p.classList.contains("dash")) tl.fromTo(p, { opacity: 0 }, { opacity: 1, duration: 0.42, ease: M.e }, at + i * 0.06);
      else { const len = p.getTotalLength(); tl.fromTo(p, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.42, ease: M.e }, at + i * 0.06); }
      // labels centre with translate(-50%,-50%); hand that to GSAP so the rise keeps it
      const l = id(k + "-l"); if (l) { l.style.transform = "none"; gsap.set(l, { xPercent: -50, yPercent: -50 }); M.enter(tl, l, at + 0.3, { rise: 8 }); }
    });
    M.enter(tl, ".title", 0.1);
    const steps = [
      [["#g-house", "#fam", "#cook", "#phone", "#app"], []],
      [["#tg", "#tw"], ["w-fam", "w-cook", "w-phone"]],
      [["#g-rails", "#rtg", "#rwake", "#rbridge", "#rcall", "#rstate", "#rguard", "#rfeed", "#rinv", "#rmock"], ["w-tg", "w-tw", "w-app", "w-guard"]],
      [["#clock", "#g-ao", "#agent", "#kb"], ["w-wake", "w-clock", "w-kb", "w-agent"]],
      [["#g-partners", "#gnani", "#pine", "#dlv"], ["w-gnani", "w-pine", "w-dlv"]],
    ];
    const all = $("svg.wires > path"); // not the arrowheads inside <defs>
    tl.set(all, { opacity: 0 }, 0);
    steps.forEach(([els, wires], i) => {
      const at = 0.5 + i * 1.1;
      M.enter(tl, els.map((s) => d.querySelector(s)), at, { stagger: 0.05, rise: 16 });
      wires.forEach((k) => tl.set(id(k), { opacity: 1 }, at + 0.25));
      draw(wires, at + 0.25);
    });
    // hero move: the haldi path, end to end
    const P = 0.5 + 5 * 1.1 + 0.4;
    const path = ["clock", "agent", "rbridge", "rguard", "pine"];
    path.forEach((k, i) => tl.to(id(k), { boxShadow: "0 0 0 3px #F2B705, 0 18px 40px -16px rgba(224,138,0,.55)", duration: 0.3, ease: M.e }, P + i * 0.35));
    ["w-clock", "w-agent", "w-guard", "w-pine"].forEach((k, i) => {
      const p = id(k), len = p.getTotalLength();
      tl.to(p, { stroke: "#E0A300", strokeWidth: 3.2, duration: 0.01 }, P + 0.15 + i * 0.35);
      tl.fromTo(p, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.35, ease: M.e }, P + 0.15 + i * 0.35);
    });
    // the guards card stays lit; the rest of the path relaxes
    ["clock", "agent", "rbridge", "pine"].forEach((k) => tl.to(id(k), { boxShadow: "0 0 0 1.5px rgba(242,183,5,.7), 0 14px 34px -18px rgba(90,55,0,.3)", duration: 0.4, ease: M.e }, P + 2.2));
    tl.set({}, {}, P + 2.2 + 0.4 + 1.5);
    chrome(tl, "s10a");
    S.done();
  };
  if (w.__ready) go(); else { const iv = setInterval(() => { if (w.__ready) { clearInterval(iv); go(); } }, 30); }
});
</script>
</body></html>
