<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>A5 · Every screen</title>
<link rel="stylesheet" href="shared/theme.css"><link rel="stylesheet" href="deck.css">
<script src="shared/vendor/gsap.min.js"></script><script src="shared/moves.js"></script><script src="timing.js"></script><script src="slide.js"></script><script src="chrome.js"></script>
<style>
  .wall { position: absolute; left: 96px; top: 236px; width: 1728px; display: grid; grid-template-columns: repeat(9, 150px); column-gap: 47.25px; row-gap: 46px; align-items: end; }
  .sc { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .sc img { display: block; width: 150px; height: 325px; object-fit: cover; border-radius: 22px; box-shadow: 0 0 0 4px #15130F, 0 22px 30px -18px rgba(40, 25, 0, 0.45); }
  .sc.wide { grid-column: span 3; }
  .sc.wide img { width: 528px; height: 297px; border-radius: 10px; box-shadow: 0 0 0 8px #15130F, 0 22px 30px -18px rgba(40, 25, 0, 0.45); }
  .sc span { font: 500 22px/1 var(--sans); color: var(--ink); white-space: nowrap; }
</style></head>
<body class="ap">
<div id="root" class="frame" data-composition-id="a05" data-start="0" data-duration="4" data-width="1920" data-height="1080">
  <div class="track"></div>
  <div class="apn">A5 · appendix</div>
  <div class="title display t4">Every screen. <span class="mute">Poster stills, on fixture data.</span></div>
  <div class="wall" id="wall" data-fig></div>
</div>
<script>
// Every screen the tour and the night show, at its poster still (film/RECORDING_DELTA.md
// section 4), one line each. The page a judge flips back to after the talk (DECK_PLAN A5).
// Stills: film/clips, scaled into assets/screens.
// [line, still]: Baari ne seekha sits mid-row so its line stays inside the safe area
const L = [["Island, open", 1], ["Aapke liye deck", 2], ["Badlo", 3], ["Cuisine deck", 4], ["Voice studio", 5], ["Khata", 6], ["Who's eating", 7], ["Baari ne seekha", 9], ["Kyun?", 10],
  ["Reminders", 8], ["The call", 11], ["Karaoke", 12], ["Raat bhar", 13], ["Kirana card", 14], ["Receipt", 15], ["The TV", 16]];
const wall = document.getElementById("wall");
L.forEach(([t, k], i) => {
  const n = String(k).padStart(2, "0");
  wall.insertAdjacentHTML("beforeend", `<div class="sc${i === 15 ? " wide" : ""}"><img src="assets/screens/${n}.jpg" alt="${t}"><span>${t}</span></div>`);
});
const S = deckSlide("a05"), tl = S.tl, M = MOVES;
M.enter(tl, ".title", 0.1);
// one wave across the wall, left to right and row by row
M.enter(tl, ".sc", 0.3, { rise: 20, stagger: 0.05 });
tl.set({}, {}, 0.3 + 15 * 0.05 + 0.52 + 1.5);
chrome(tl, "a05");
// the stills are images: wait for them so the export never catches a blank phone
Promise.all([...document.images].map((im) => im.decode().catch(() => {}))).then(() => S.done());
</script>
</body></html>
