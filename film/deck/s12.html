<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Slide 12 · Tested on bad nights</title>
<link rel="stylesheet" href="shared/theme.css"><link rel="stylesheet" href="deck.css">
<script src="shared/vendor/gsap.min.js"></script><script src="shared/moves.js"></script><script src="timing.js"></script><script src="slide.js"></script><script src="chrome.js"></script>
<style>
  .dg { position: absolute; left: 96px; top: 300px; width: 1728px; height: 630px; border: 0; background: transparent; }
  .when { position: absolute; left: 96px; top: 252px; }
  .strip { position: absolute; left: 96px; top: 956px; display: flex; gap: 14px; }
  .strip .chip { font-size: 22px; padding: 12px 20px; }
  .strip .chip b { font-weight: 600; }
  .strip .ok { color: var(--ok); } .strip .hx { color: var(--haldi-text); } .strip .mu { color: var(--mute); }
</style></head>
<body>
<div id="root" class="frame" data-composition-id="s12" data-start="0" data-duration="8" data-width="1920" data-height="1080">
  <div class="track"></div>
  <div class="title display t4">Tested on bad nights.</div>
  <div class="when src">82 platform runs on Baari-eval, 4 October, 17:17 to 20:38 IST · evals/out/runs.csv</div>
  <iframe class="dg" id="d06" src="../../docs/diagrams/src/06-evals.html?slide" title="Ten bad nights, 82 runs"></iframe>
  <div class="strip">
    <span class="chip glass">Telegram <b class="ok">real</b></span>
    <span class="chip glass">Gnani <b class="ok">real</b></span>
    <span class="chip glass">Pine Labs links <b class="hx">sandbox</b></span>
    <span class="chip glass">Reserve Pay <b class="hx">sandbox, demo debits</b></span>
    <span class="chip glass">Delhivery <b class="mu">mock</b></span>
    <span class="chip glass">Twilio <b class="mu">trial</b></span>
  </div>
</div>
<script>
// Diagram 06's slide cut. The dots fill in the order the runs happened, so the room
// watches red turn green; each header counts up as its group finishes, with its note.
// The E04 box lights last, on its own press: it is the reason for the ask (DECK_PLAN slide 12).
const S = deckSlide("s12"), tl = S.tl, M = MOVES;
const f = document.getElementById("d06");
f.addEventListener("load", () => {
  const w = f.contentWindow;
  const go = () => {
    const d = f.contentDocument, $ = (s) => [...d.querySelectorAll(s)], id = (x) => d.getElementById(x);
    M.enter(tl, ".title", 0.1);
    M.enter(tl, ".when", 0.2, { rise: 12 });
    M.enter(tl, [d.querySelector(".legend"), ...$(".rowl")], 0.25, { rise: 12, stagger: 0.03 });
    M.enter(tl, $(".gh"), 0.35, { rise: 12, stagger: 0.05 });
    const dots = $(".dot");
    tl.set(dots, { opacity: 0 }, 0);
    tl.set([id("hl3"), id("hl4"), id("b1"), id("b2"), id("b3"), id("b4"), id("n1"), id("n2"), id("n3"), id("n4")], { opacity: 0 }, 0);
    // hero move: the runs, one column at a time, a short breath between groups
    let t = 0.8;
    for (let g = 0; g < 4; g++) {
      const gd = dots.filter((x) => +x.dataset.g === g);
      tl.fromTo(gd, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.2, ease: M.e, stagger: 0.04 }, t);
      t += gd.length * 0.04 + 0.1;
      const gh = id("gh" + g);
      M.count(tl, gh.querySelector(".v"), +gh.dataset.pass, t, { dur: 0.45 });
      if (g < 2) { M.enter(tl, id("b" + (g + 1)), t, { rise: 8 }); M.enter(tl, id("n" + (g + 1)), t + 0.1, { rise: 16 }); }
      if (g === 2) { M.enter(tl, [id("hl3"), id("b3")], t, { rise: 0 }); M.enter(tl, id("n3"), t + 0.1, { rise: 16 }); }
      t += 0.25;
    }
    // the E04 box, last and on its own press
    const e = S.at(0);
    M.enter(tl, [id("hl4"), id("b4")], e + 0.1, { rise: 0 });
    M.enter(tl, id("n4"), e + 0.2, { rise: 16 });
    M.enter(tl, ".strip .chip", e + 0.5, { rise: 16, stagger: 0.05 });
    tl.set({}, {}, e + 0.5 + 0.25 + 0.52 + 1.5);
    chrome(tl, "s12");
    S.done();
  };
  if (w.__ready) go(); else { const iv = setInterval(() => { if (w.__ready) { clearInterval(iv); go(); } }, 30); }
});
</script>
</body></html>
