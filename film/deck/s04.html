<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Slide 4 · Who we are</title>
<link rel="stylesheet" href="shared/theme.css"><link rel="stylesheet" href="deck.css">
<script src="shared/vendor/gsap.min.js"></script><script src="shared/moves.js"></script><script src="timing.js"></script><script src="slide.js"></script><script src="chrome.js"></script>
<style>
  .team { position: absolute; left: 96px; top: 210px; width: 1728px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
  .p .face { width: 168px; height: 168px; border-radius: 50%; display: grid; place-items: center; font: 500 85px/1 var(--display); letter-spacing: -0.04em; color: var(--ink); box-shadow: inset 0 0 0 1px var(--hair); }
  .p .nm { margin-top: 30px; }
  .p .ln { margin-top: 14px; font: 400 35px/1.3 var(--sans); letter-spacing: -0.016em; color: var(--mute); max-width: 500px; }
  .nums { position: absolute; left: 96px; top: 770px; width: 1728px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; padding-top: 34px; border-top: 1px solid var(--hair); }
  .nums .v { font: 500 107px/1 var(--mono); letter-spacing: -0.04em; color: var(--ink); }
  .nums .k { margin-top: 12px; font: 500 28px/1.3 var(--sans); color: var(--mute); }
</style></head>
<body>
<div id="root" class="frame" data-composition-id="s04" data-start="0" data-duration="6" data-width="1920" data-height="1080">
  <div class="track"></div>
  <div class="team">
    <div class="p"><div class="face" aria-hidden="true" style="background:var(--t-haldi)">C</div><div class="nm display t3">Chaitanya</div><div class="ln">Has briefed a cook daily for three years.</div></div>
    <div class="p"><div class="face" aria-hidden="true" style="background:var(--t-sky)">V</div><div class="nm display t3">Vinay</div><div class="ln">Builds voice and payments. Ships on Gnani.</div></div>
    <div class="p"><div class="face" aria-hidden="true" style="background:var(--t-green)">K</div><div class="nm display t3">Keshav</div><div class="ln">Runs the same loop at home.</div></div>
  </div>
  <div class="nums">
    <div><div class="v" id="n1">11</div><div class="k">households before we built</div></div>
    <div><div class="v" id="n2">3</div><div class="k">after</div></div>
    <div><div class="v" id="n3">8</div><div class="k">cities</div></div>
  </div>
</div>
<script>
// Faces pop on the app's spring; the numbers roll like the app's digits, no bounce (DECK_PLAN slide 4).
const S = deckSlide("s04"), tl = S.tl, M = MOVES;
M.pop(tl, ".face", 0.15, { stagger: 0.12 });
M.enter(tl, ".p .nm", 0.35, { stagger: 0.12 });
M.enter(tl, ".p .ln", 0.45, { stagger: 0.12 });
M.enter(tl, ".nums", 1.1, { rise: 16 });
M.count(tl, document.getElementById("n1"), 11, 1.2, { dur: 0.8 });
M.count(tl, document.getElementById("n2"), 3, 1.32, { dur: 0.6 });
M.count(tl, document.getElementById("n3"), 8, 1.44, { dur: 0.7 });
tl.set({}, {}, 1.44 + 0.7 + 1.5);
chrome(tl, "s04");
S.done();
</script>
</body></html>
