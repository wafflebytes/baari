<!doctype html>
<!-- Renders iPhone mockups of baari.pages.dev for the README.
     Usage: phones.html?s=vote,locked,khata  (names from SCREENS below).
     Shot with headless Chrome by docs/mockup/shoot.sh. -->
<meta charset="utf-8">
<style>
  html,body{margin:0;background:#F3F2EE}
  body{display:flex;gap:56px;padding:48px 56px;align-items:flex-start;font:600 22px/1.3 -apple-system,system-ui,sans-serif;color:#0d0d0e}
  figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:22px}
  .phone{position:relative;width:390px;height:844px;padding:14px;border-radius:66px;background:#0d0d0e;
    box-shadow:0 0 0 2px #3a3a3c inset,0 0 0 1px #000,0 40px 80px -20px rgba(0,0,0,.35)}
  .screen{position:relative;width:390px;height:844px;border-radius:52px;overflow:hidden;background:#fff}
  iframe{border:0;width:390px;height:790px;display:block}
  .bar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 34px 0 44px;font:600 17px/1 -apple-system,system-ui,sans-serif;background:#fff}
  .bar i{display:flex;gap:6px;align-items:center}
  .bar b{display:inline-block;width:25px;height:12px;border:1.5px solid #0d0d0e;border-radius:4px;position:relative}
  .bar b::after{content:"";position:absolute;inset:1.5px;right:5px;background:#0d0d0e;border-radius:1.5px}
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:36px;border-radius:20px;background:#000;z-index:2}
  figcaption{font-weight:600;letter-spacing:-.01em}
  figcaption span{display:block;font-weight:400;font-size:17px;color:#6b6b70;text-align:center;margin-top:2px}
</style>
<body>
<script>
const B = "https://baari.pages.dev";
const SCREENS = {
  vote: [`${B}/?fixture=shortlist#/`, "Ghar, 8:30 pm", "Two dishes, one vote each"],
  locked: [`${B}/?fixture=lock#/`, "Ghar, 9:30 pm", "Dinner is locked"],
  khata: [`${B}/?fixture=lock#/khata`, "Khata", "Reserve Pay block and limits"],
  delivery: [`${B}/?fixture=morning#/delivery`, "Delivery", "Delhivery parcel overnight"],
  sunita: [`${B}/?fixture=morning#/sunita`, "Sunita", "The cook's Hindi voice brief"],
  why: [`${B}/?fixture=lock#/baari`, "Why", "Every decision, with its rule"],
  receipt: [`${B}/receipt/?fixture=lock`, "Receipt", "Where every rupee went"],
};
const pick = (new URLSearchParams(location.search).get("s") || "vote,locked,khata").split(",");
document.body.innerHTML = pick.map((k) => {
  const [src, t, sub] = SCREENS[k];
  return `<figure><div class="phone"><div class="screen"><div class="island"></div><div class="bar"><span>9:41</span><i><svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><b></b></i></div><iframe src="${src}" scrolling="no"></iframe></div></div><figcaption>${t}<span>${sub}</span></figcaption></figure>`;
}).join("");
</script>
