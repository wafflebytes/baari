<!doctype html><meta charset="utf-8"><title>Baari ambient layer</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=block" rel="stylesheet"><link rel="stylesheet" href="../kit.css"><script src="../kit.js"></script>
<style>
.canvas{width:1640px;height:1000px}
.lane{position:absolute;left:44px;width:220px}
.lane .t{font:650 16px/1.2 var(--body)} .lane .s{font:400 11.5px/1.45 var(--mono);color:var(--text-2);margin-top:4px}
.rule{position:absolute;left:280px;right:40px;height:0;border-top:1px dashed var(--group)}
.band{position:absolute;top:118px;bottom:150px;border-radius:18px}
.tick{position:absolute;top:96px;transform:translateX(-50%);font:500 11.5px var(--mono);color:var(--text-3)}
.tick::after{content:"";position:absolute;left:50%;top:18px;height:8px;border-left:1px solid var(--group)}
.dot{position:absolute;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);background:var(--ink);z-index:3;box-shadow:0 0 0 4px var(--bg)}
.dot.hot{background:var(--haldi)} .dot.red{background:var(--red)} .dot.ring{background:var(--bg);box-shadow:inset 0 0 0 2px var(--ink),0 0 0 4px var(--bg)}
.run{position:absolute;width:12px;height:30px;border-radius:7px;transform:translate(-50%,-50%);background:var(--island);z-index:3;box-shadow:0 0 0 3px var(--bg)}
html.dk .run{background:#F3F0E9}
.cap{position:absolute;font:500 11.5px/1.35 var(--mono);color:var(--text-2);white-space:nowrap;z-index:4;background:var(--bg);padding:1px 4px;border-radius:5px}
.cap b{color:var(--ink);font-weight:600} .cap.hot b{color:var(--haldi-text)}
.vline{position:absolute;width:0;border-left:1.2px solid var(--wire);z-index:1;opacity:.55}
.hatch{position:absolute;height:34px;border-radius:9px;background:repeating-linear-gradient(135deg,var(--chip) 0 6px,transparent 6px 12px);z-index:0}
.break{position:absolute;top:90px;font:600 11px var(--mono);color:var(--text-3);transform:translateX(-50%);letter-spacing:.06em;text-transform:uppercase}
</style>
<div class="canvas" id="cv">
  <div class="kicker"><img src="../../../app/img/baari-mark.png">Baari · the ambient layer · one night</div>
</div>
<script>
// Time axis: the evening is wide, the night is squeezed, the morning is wide again.
function X(hh, mm = 0) {
  let h = hh + mm / 60; if (h < 12) h += 24;
  if (h <= 22) return 300 + (h - 20) * 290;
  if (h <= 30) return 880 + (h - 22) * 36;
  return 1168 + (h - 30) * 140;
}
const cv = document.getElementById("cv");
const add = (cls, style, html = "") => { const e = document.createElement("div"); e.className = cls; Object.assign(e.style, style); e.innerHTML = html; cv.appendChild(e); return e; };
const LANES = [
  ["clock", 200, "The clock", "baari-clock, cron every minute, fires each phase on time"],
  ["msg", 300, "A message", "Telegram webhook. It wakes the phase that's waiting for it"],
  ["event", 400, "An event", "rails checks once a minute for a late ETA, an NDR or RTO, a missing item or a failed debit"],
  ["miss", 500, "A missed step", "rails checks the agent's work and wakes it to finish"],
  ["run", 640, "Baari runs", "one short run per wake. HANDOFF carries state between them"],
  ["say", 780, "What people hear", "only what a rule says to send"],
];
// bands: night and morning
add("band", { left: X(21) + "px", width: (X(6) - X(21)) + "px", background: "var(--night)", opacity: document.documentElement.classList.contains("dk") ? .28 : .08 });
add("band", { left: X(6) + "px", width: (X(9) - X(6)) + "px", background: "var(--haldi)", opacity: document.documentElement.classList.contains("dk") ? .10 : .12 });
for (const [h, m, l] of [[20,0,"20:00"],[20,30,"20:30"],[21,0,"21:00"],[21,30,"21:30"],[22,0,"22:00"],[6,0,"06:00"],[7,0,"07:00"],[8,0,"08:00"],[9,0,"09:00"]]) add("tick", { left: X(h, m) + "px" }, l);
add("break", { left: (X(22) + X(6)) / 2 + "px" }, "night, squeezed");
for (const [k, y, t, s] of LANES) {
  add("lane", { top: y - 22 + "px" }, `<div class="t">${t}</div><div class="s">${s}</div>`);
  add("rule", { top: y + "px" });
}
const Y = Object.fromEntries(LANES.map(([k, y]) => [k, y]));
// No memory asks between 22:00 and 08:00
add("hatch", { left: X(22) + "px", width: (X(8) - X(22)) + "px", top: Y.say - 17 + "px" });
const hc = add("cap", { top: Y.say - 9 + "px" }, "no memory asks, 22:00 to 08:00"); hc.style.left = X(2) - hc.offsetWidth / 2 + "px";

// wakes: [lane, h, m, caption, phase run label, class]
const wakes = [
  ["clock", 20, 30, "<b>SHORTLIST</b>", "hot"],
  ["miss", 20, 33, "<b>CARD MISSING</b><br>holder got no buttons"],
  ["msg", 20, 41, "<b>Papa</b>, a voice note:<br>'rajma'"],
  ["msg", 21, 12, "<b>Mummy</b>: 'kal bahar<br>khaungi'. Away, 3 eat"],
  ["clock", 21, 30, "<b>LOCK</b>", "hot"],
  ["clock", 21, 35, "<b>BUY</b>", "hot"],
  ["miss", 21, 41, "<b>STAPLES SKIPPED</b><br>BUY runs again"],
  ["clock", 22, 45, "<b>CHECK</b>", "hot"],
  ["event", 23, 40, "<b>ETA 08:10</b><br>past the cutoff"],
  ["clock", 6, 30, "<b>CHECK</b>", "hot"],
  ["event", 6, 52, "<b>kirana</b>: methi<br>missing"],
  ["clock", 7, 45, "<b>BRIEF</b>", "hot"],
  ["msg", 8, 2, "<b>Sunita</b>: 'haan haan'"],
];
const says = [
  [20, 30, "pick card to the holder,<br>a heads-up to the rest", -1],
  [21, 30, "'Rajma chawal, pakka'", -1],
  [21, 35, "Pay ₹520 · Pine Labs,<br>to the parent who pays", 1],
  [7, 45, "Hindi voice<br>note to Sunita", -1],
  [8, 2, "'Kitni rotiyan?'", 1],
];
for (const [lane, h, m, cap, cls] of wakes) {
  const x = X(h, m), y = Y[lane];
  add("vline", { left: x + "px", top: y + "px", height: (Y.run - y) + "px" });
  add("dot" + (lane === "clock" ? " hot" : lane === "miss" ? " red" : lane === "event" ? " ring" : ""), { left: x + "px", top: y + "px" });
  const c = add("cap" + (cls ? " " + cls : ""), { top: (lane === "clock" ? y - 30 : y + 12) + "px" }, cap);
  c.style.left = x - (lane === "clock" ? c.offsetWidth / 2 : 6) + "px";
  if (lane === "clock" && (h === 21 && m === 30)) c.style.left = x - c.offsetWidth + 4 + "px";
  if (lane === "clock" && (h === 21 && m === 35)) c.style.left = x - 2 + "px";
  add("run", { left: x + "px", top: Y.run + "px" });
}
for (const [h, m, cap, side] of says) {
  const x = X(h, m);
  add("vline", { left: x + "px", top: Y.run + "px", height: (Y.say - Y.run) + "px" });
  add("dot hot", { left: x + "px", top: Y.say + "px" });
  const c = add("cap", { top: (side < 0 ? Y.say + 14 : Y.say + 14) + "px" }, cap);
  c.style.left = (side < 0 ? x - c.offsetWidth + 6 : x - 6) + "px";
}
// HANDOFF note between runs
const ho = add("cap", { top: Y.run - 32 + "px" }, "<b>HANDOFF</b> waits on rails"); ho.style.left = X(2, 30) - ho.offsetWidth / 2 + "px";
// footer: the quiet log
const f = add("node", { left: "300px", top: "872px", width: "1300px", padding: "16px 20px" },
  `<div class="tx" style="display:flex;gap:28px;align-items:center;width:100%">
     <div class="t" style="flex:none">This night</div>
     <div class="s" style="margin:0"><b>13 runs</b>, woken by the clock 6 times, by messages 3, by events 2, by missed steps 2. <b>5 messages</b> reached a person. Nobody opened an app.</div>
     <div class="s" style="margin:0 0 0 auto;flex:none">the app's quiet log counts this every night</div>
   </div>`);
W.draw(() => {});
</script>
