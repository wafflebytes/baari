<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baari receipt</title>
<meta name="description" content="Aaj ki thali: kya bana, kahan se aaya, har rupaya kahan gaya.">
<meta name="theme-color" content="#F3F3F3">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/receipt/receipt.css">
<script>
  // same theme switch as the app; runs before paint so there's no flash
  (function () {
    var t = "system"; try { t = localStorage.getItem("baari:theme") || "system"; } catch (e) {}
    var dk = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.classList.toggle("dk", dk);
    document.querySelector('meta[name="theme-color"]').content = dk ? "#0F0E0C" : "#F3F3F3";
  })();
</script>
</head>
<body>
<main class="wrap">
  <div class="bar"><a class="back" href="/#/khata" aria-label="Khata pe wapas">←</a><span id="src" class="src"></span></div>
  <article id="receipt" class="receipt" aria-live="polite"><div class="skel"><i></i><i></i><i></i><i></i></div></article>
  <button id="save" class="btn" type="button" disabled>Save image</button>
  <p class="hint" id="hint"></p>
</main>
<script type="module" src="/receipt/receipt.js"></script>
</body>
</html>
