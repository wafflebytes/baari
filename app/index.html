<script>
// Theme before first paint, so a dark phone never flashes cream.
(function () {
  var t = "system"; try { t = localStorage.getItem("baari:theme") || "system"; } catch (e) {}
  var dk = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.classList.toggle("dk", dk);
  try { if (localStorage.getItem("baari:big") === "1") document.documentElement.classList.add("big"); } catch (e) {}
  document.querySelector('meta[name="theme-color"]').content = dk ? "#0F0E0C" : "#F6F4EF";
})();
</script>
</head>
